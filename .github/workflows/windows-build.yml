name: Windows x64 build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Test ISO9660 image and Windows virtual CD mount
        shell: pwsh
        run: |
          npm test
          ./tests/windows-iso-mount.ps1 -IsoPath work/dicom-iso-fixture.iso
      - name: Build NSIS installer
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc --bundles nsis
      - name: Package portable executable
        shell: pwsh
        run: |
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/dicom-converter-desktop.exe"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          New-Item -ItemType Directory -Force -Path work/portable | Out-Null
          Copy-Item $exe work/portable/DICOM-Converter-Desktop-1.2.1-portable.exe
          Compress-Archive -Path work/portable/DICOM-Converter-Desktop-1.2.1-portable.exe -DestinationPath artifacts/DICOM-Converter-Desktop-1.2.1-portable.zip -Force
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" artifacts/ -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dicom-converter-desktop-windows-x64
          path: artifacts/*
          if-no-files-found: error
